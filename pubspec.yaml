name: snap_and_cook_app
description: "Snap & Cook - AI powered recipe recommender."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  google_generative_ai: ^0.4.4
  intl: ^0.19.0
  google_fonts: ^6.2.1
  # Firebase dependencies (to be configured later)
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - cookandsnaplogo.jpeg
